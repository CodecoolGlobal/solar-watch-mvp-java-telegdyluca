spring.application.name=solar-watch

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/solarwatch?sslmode=disable}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

codecool.app.geourl = https://api.openweathermap.org/geo/1.0/direct?q=%s&appid=%s
codecool.app.sunriseurl = https://api.sunrise-sunset.org/v2?lat=%s&lng=%s&date=%s

codecool.app.jwtSecret=${SOLARWATCH_JWT_SECRET}
codecool.app.jwtExpirationMs=${SOLARWATCH_JWT_EXPIRATION}

codecool.app.admin-password=${SOLARWATCH_ADMIN_PASSWORD}

codecool.app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}